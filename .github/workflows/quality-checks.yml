name: OrderFlow core checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: orderflow_test
          POSTGRES_USER: orderflow_test
          POSTGRES_PASSWORD: runner_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderflow_test -d orderflow_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://orderflow_test:runner_test_only@127.0.0.1:5432/orderflow_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Check dependencies, lint, format and tests
        run: sh scripts/check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-checks-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
