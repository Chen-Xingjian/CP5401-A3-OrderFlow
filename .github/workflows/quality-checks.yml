name: OrderFlow quality checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Check dependencies, lint, format and tests
        run: sh scripts/check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-checks-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
