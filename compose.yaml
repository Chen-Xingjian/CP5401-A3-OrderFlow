services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: orderflow_test
      POSTGRES_USER: orderflow_test
      POSTGRES_PASSWORD: local_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow_test -d orderflow_test"]
      interval: 2s
      timeout: 3s
      retries: 25
  checks:
    build: .
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://orderflow_test:local_test_only@db/orderflow_test
    depends_on:
      db:
        condition: service_healthy
